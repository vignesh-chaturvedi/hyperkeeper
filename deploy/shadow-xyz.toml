# Shadow-mode config for trade[XYZ]'s HIP-3 DEX (`xyz` on mainnet): price its most-traded
# stocks, two metals and two currencies, and compare with the oracle its deployer publishes.
#
# trade[XYZ] publishes an external price while the underlying trades (24/5 for US stocks,
# 23/5 for metals, 24/5 for FX) and moves its oracle with its own order book otherwise.
# Pyth's US stock feeds cover regular hours, and xStocks trade around the clock at a premium
# to the stock outside regular hours, so compare each source separately (`quotes` in the
# log) and expect the closest match while the US market is open.
#
# The pyth source needs HYPERKEEPER_PYTH_API_KEY. Without it, only xStocks price. A key's
# plan may cover only some feeds (Pyth's demo plan: TSLA, gold, silver, EUR/USD, USD/JPY);
# hyperkeeper learns which from Pyth's errors and leaves the others to xStocks.
network = "mainnet"
dex = "xyz"
star = false
interval_ms = 3000

[sources]
spot = ["pyth", "bybit-xstock"]
perp = []
max_age_ms = 10000
min_sources = 1
max_deviation_bps = 100
convention = "usd"

[guards]
max_move_bps = 200
unsent_alarm_ticks = 3

# Stocks with both a Pyth feed and an xStock, by trade[XYZ] volume on Oct 16, 2026.
[[asset]]
coin = "xyz:NVDA"
symbol = "NVDA"
pyth = "Equity.US.NVDA/USD"

